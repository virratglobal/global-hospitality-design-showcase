<!-- Simple Scroll Script to hide/show headers on scroll for editorial feel -->
<script>
        let lastScrollTop = 0;
        const topNav = document.getElementById('top-nav');
        const bottomFooter = document.getElementById('bottom-footer');
        
        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                // Downscroll
                topNav.style.transform = 'translateY(-100%)';
                bottomFooter.style.transform = 'translateY(100%)';
            } else {
                // Upscroll
                topNav.style.transform = 'translateY(0)';
                bottomFooter.style.transform = 'translateY(0)';
            }
            lastScrollTop = scrollTop;
        });
    </script>
