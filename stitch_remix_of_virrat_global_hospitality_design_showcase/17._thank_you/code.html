<!DOCTYPE html>

<head>

            "margin-desktop": "80px",
            "gutter": "32px",

            "section-gap": "160px"

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>

<body class="bg-background text-on-background font-body-md min-h-screen antialiased flex flex-col justify-center">
  
  <main class="w-full flex-grow flex flex-col justify-center relative min-h-screen">
    
    <!-- Grid Layout -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-0 min-h-screen w-full items-stretch">
      
      <!-- Left Column (60% width) -->
      <div class="col-span-1 md:col-span-7 flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-24 md:py-32 relative">
        <div class="max-w-2xl flex flex-col gap-8 justify-center h-full">
          <h1 class="font-display-lg-mobile md:font-display-lg leading-none uppercase font-bold tracking-tight text-[64px] md:text-[96px] text-primary">
            THANK YOU
          </h1>
          <p class="font-body-lg text-body-lg text-secondary text-[20px] md:text-[24px] leading-relaxed max-w-lg">
            Let's create something remarkable for your brand.
          </p>
          <div class="mt-4">
            <button class="nav-menu-link bg-[#1c1b1b] text-white hover:bg-primary px-8 py-4 font-bold tracking-wider transition-colors duration-300 font-label-caps text-label-caps uppercase rounded-none shadow" data-section="contact">
              START A PROJECT
            </button>
          </div>
        </div>
      </div>
      
      <!-- Right Column (40% width) -->
      <div class="col-span-1 md:col-span-5 bg-surface-container-low dark:bg-surface-container flex flex-col justify-center px-8 md:px-16 py-24 md:py-32 relative border-l border-outline-variant/30">
        <div class="max-w-md w-full flex flex-col gap-10">
          <div>
            <h2 class="font-headline-md text-headline-md font-bold tracking-tight text-[28px] md:text-[32px] text-on-background">
              VIRRAT GLOBAL
            </h2>
            <p class="text-xs font-semibold uppercase tracking-wider text-outline mt-2 leading-relaxed font-label-caps">
              Digital Marketing &bull; Creative Design &bull; Brand Communication
            </p>
          </div>
          
          <hr class="border-outline-variant/50 w-full"/>
          
          <div class="flex flex-col gap-6">
            <div class="flex flex-col gap-1">
              <span class="text-[11px] font-bold uppercase tracking-widest text-[#8f6f6c] font-label-caps">WEBSITE</span>
              <a href="https://virratglobal.com" target="_blank" class="text-body-lg font-semibold text-on-background hover:text-primary transition-colors duration-300">virratglobal.com</a>
            </div>
            
            <div class="flex flex-col gap-1">
              <span class="text-[11px] font-bold uppercase tracking-widest text-[#8f6f6c] font-label-caps">EMAIL</span>
              <a href="mailto:hello@virratglobal.com" class="text-body-lg font-semibold text-on-background hover:text-primary transition-colors duration-300">hello@virratglobal.com</a>
            </div>
            
            <div class="flex flex-col gap-1">
              <span class="text-[11px] font-bold uppercase tracking-widest text-[#8f6f6c] font-label-caps">PHONE</span>
              <span class="text-body-lg font-semibold text-on-background font-mono-numeral">+1 (555) 123-4567</span>
            </div>
          </div>
          
          <!-- Social Icons Row -->
          <div class="flex gap-6 text-on-background mt-2">
            <a href="#" class="hover:text-primary transition-colors duration-300" aria-label="Website Link">
              <span class="material-symbols-outlined font-normal" style="font-size: 20px;">link</span>
            </a>
            <a href="#" class="hover:text-primary transition-colors duration-300" aria-label="Share">
              <span class="material-symbols-outlined font-normal" style="font-size: 20px;">share</span>
            </a>
            <a href="mailto:hello@virratglobal.com" class="hover:text-primary transition-colors duration-300" aria-label="Email Us">
              <span class="material-symbols-outlined font-normal" style="font-size: 20px;">mail</span>
            </a>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Footer aligned absolutely at the bottom -->
    <div class="absolute bottom-8 left-0 w-full px-margin-mobile md:px-margin-desktop flex justify-between items-center z-10 text-[11px] font-semibold text-on-surface-variant font-label-caps tracking-wider">
      <div>
        &copy; 2024 Virrat Global. Curating Taste.
      </div>
      <div class="flex gap-6">
        <a href="#slide-01" class="hover:text-primary transition-colors duration-300 cursor-pointer">INDEX</a>
        <a href="#slide-01" class="hover:text-primary transition-colors duration-300 cursor-pointer">NEXT SLIDE</a>
      </div>
    </div>
